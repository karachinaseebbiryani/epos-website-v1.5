name: knb_customer
description: Karachi Naseeb — customer ordering app (Flutter)
publish_to: "none"
version: 0.0.1+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1      # state management (no codegen)
  dio: ^5.4.0                   # HTTP client + interceptors
  flutter_secure_storage: ^9.0.0 # encrypted token storage
  go_router: ^13.2.0            # declarative routing / redirects
  cached_network_image: ^3.3.1  # menu images
  intl: ^0.19.0                 # currency / date formatting
  connectivity_plus: ^6.0.3     # offline detection
  geolocator: ^13.0.1           # GPS for delivery location
  google_sign_in: ^6.2.2        # Google OAuth sign-in
  image_picker: ^1.1.2          # payment proof screenshot upload
  webview_flutter: ^4.7.0       # SafePay hosted-checkout gateway
  firebase_core: ^3.6.0         # required by firebase_messaging (push)
  firebase_messaging: ^15.1.3   # order-status push notifications (FCM)
  flutter_facebook_auth: ^7.1.1 # Facebook OAuth sign-in
  google_fonts: ^6.2.1          # Outfit (display) + Manrope (body) to match website
  shared_preferences: ^2.3.2    # cart persistence across app restarts
  in_app_review: ^2.0.9         # Google Play in-app review prompt

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
