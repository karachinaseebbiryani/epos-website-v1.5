# fly.toml app configuration file generated for knb-backend on 2026-06-12T11:16:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "knb-backend"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # MUST stay always-on: APScheduler (daily Z-report) + JWT INSTANCE_ID
  # (tokens are invalidated whenever the process restarts).
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  checks = [{ grace_period = '20s', interval = '30s', method = 'GET', path = '/api/public/restaurant-info', timeout = '5s' }]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/public/restaurant-info"

[mounts]
  source = "knb_uploads"
  destination = "/app/uploads"

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

[processes]
  app = ''
